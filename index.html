<meta name="viewport" content="width=device-width, initial-scale=1">
<title>anida® — El sistema operativo del financiamiento de vivienda</title>
<meta name="description" content="anida® — El sistema operativo del financiamiento de vivienda.">
<meta name="theme-color" content="#014eaa">
<link rel="icon" type="image/svg+xml" href="favicon.svg">
<link rel="preload" as="image" href="cielo.webp">
<link rel="preload" as="image" href="edificio.webp">
<link rel="preconnect" href="https://fonts.googleapis.com">

<style>
  :root{
    --verde:#22c986;
    --blanco:#fff;
    --azul:#014eaa;
    --logo-w:200px;
    --txt:22px;
    --pie:20px;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{height:100%}
  body{
    font-family:"Figtree",system-ui,sans-serif;
    color:var(--blanco);
    background-color:var(--azul);
    min-height:100vh;min-height:100dvh;
    display:flex;flex-direction:column;
    -webkit-font-smoothing:antialiased;
  }
  main{
    flex:1;
    display:flex;flex-direction:column;align-items:center;
    padding:clamp(48px,12vh,130px) 16px 48px;
    text-align:center;
  }
  .logo{width:var(--logo-w);height:auto;display:block;filter:drop-shadow(0 2px 14px rgba(0,30,90,.35))}
  h1{
    margin-top:clamp(56px,16vh,140px);
    font-weight:400;
    font-size:var(--txt);
    line-height:1.4;
    max-width:22ch;
    text-shadow:0 1px 14px rgba(0,30,90,.55),0 0 2px rgba(0,30,90,.35);
  }
  @media (min-width:768px){ h1{max-width:none} }
  /* ---- Escena en capas: cielo · nubes · edificio ---- */
  .escena{position:fixed;inset:0;z-index:-1;overflow:hidden;background:var(--azul)}
  .capa{position:absolute;inset:0;background-repeat:no-repeat;
    background-size:cover;background-position:var(--bx,50%) bottom}
  .cielo{background-image:url("cielo.webp"),url("cielo.jpg")}
  .nubes{background-image:url("nubes.webp");opacity:.9}
  /* Nubes que cruzan: cada una con su tamaño, altura, velocidad y transparencia */
  .vuelo{position:absolute;inset:0;pointer-events:none}
  .vuelo img{position:absolute;left:100%;height:auto;will-change:transform;
    animation:cruza var(--t) linear var(--d) infinite}
  .n1{width:clamp(220px,30vw,460px);top:6%; --t:150s;--d:-40s;opacity:.75}
  .n2{width:clamp(260px,38vw,560px);top:52%;--t:190s;--d:-120s;opacity:.6}
  .n3{width:clamp(180px,24vw,360px);top:34%;--t:120s;--d:-75s;opacity:.55;filter:blur(1.5px);transform:scaleX(-1)}
  .n4{width:clamp(120px,15vw,230px);top:70%;--t:105s;--d:-20s;opacity:.7}
  .n5{width:clamp(110px,13vw,200px);top:18%;--t:170s;--d:-150s;opacity:.4;filter:blur(2px)}
  @keyframes cruza{from{translate:0 0}to{translate:calc(-100vw - 100% - 40px) 0}}
  .brillo{background:radial-gradient(120% 60% at 70% 0%,rgba(255,255,255,.16),rgba(255,255,255,0) 60%);
    animation:luz 14s ease-in-out infinite alternate}
  .edificio{background-image:url("edificio.webp");
    animation:entra 1.6s cubic-bezier(.2,.7,.2,1) both}
  .velo{display:none}
  @keyframes luz{from{opacity:.4;transform:translateX(-4%)}to{opacity:1;transform:translateX(4%)}}
  @keyframes entra{from{transform:translateY(24px);opacity:0}to{transform:none;opacity:1}}
  main > *{animation:aparece 1.2s .2s cubic-bezier(.2,.7,.2,1) both}
  main > h1{animation-delay:.45s}
  @keyframes aparece{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:none}}
  @media (prefers-reduced-motion:reduce){
    .vuelo img,.edificio,.brillo,main > *{animation:none}
  }
  @media (max-width:1023px){ .escena{--bx:20%} }
  @media (max-width:767px){
    .capa{background-size:170% auto;--bx:0%}
    .n5,.n3{display:none}
    .velo{display:block;background:linear-gradient(to bottom,var(--azul) 0,var(--azul) 48%,rgba(1,78,170,0) 64%)}
  }
  /* Footer — spec Figma: padding 64/16/32 · Figtree 400 · lh 120% · blanco 92% */
  footer{
    padding:64px 16px calc(32px + env(safe-area-inset-bottom));
    text-align:center;
    background:linear-gradient(to bottom,rgba(1,40,100,0) 0%,rgba(1,40,100,.55) 100%);
  }
  footer p{font-size:var(--pie);line-height:1.2;font-weight:400;color:rgba(255,255,255,.92);
    text-shadow:0 1px 6px rgba(0,25,70,.55)}
  footer sup{font-size:.75em;line-height:0}
  .sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}

  /* Desktop grande ≥1440 */
  @media (min-width:1440px){ :root{--logo-w:230px;--txt:26px} }
  /* Desktop 1024–1439 */
  @media (max-width:1439px){ :root{--logo-w:200px;--txt:22px} }
  /* Tablet 768–1023 */
  @media (max-width:1023px){
    :root{--logo-w:180px;--txt:20px;--pie:18px}
  }
  /* Mobile <768 */
  @media (max-width:767px){
    :root{--logo-w:150px;--txt:18px;--pie:16px}
  }
  /* Mobile chico ≤375 */
  @media (max-width:375px){ :root{--logo-w:130px;--txt:17px} }
</style>
</head>
